spring.application.name=portfolio
# Porta do Servidor
server.port=${PORT:8080}

# Configuração do PostgreSQL com Fallback
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfoliodb}
spring.datasource.username=${DB_USER:devops_user}
spring.datasource.password=${DB_PASSWORD:devops_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Actuator (Health check & métricas)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always