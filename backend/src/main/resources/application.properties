spring.application.name=portfolio
# Porta do Servidor
server.port=${PORT:8080}

# Configuração do PostgreSQL com Fallback
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio_db}
spring.datasource.username=${DB_USER:devops_user}
spring.datasource.password=${DB_PASSWORD:devops_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# Habilita endpoints do Actuator e permite chamadas do Frontend
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info
management.endpoints.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
management.endpoints.web.cors.allowed-methods=GET